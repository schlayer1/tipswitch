<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Heimbürgeschule Blue to Teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00558F" />
      <stop offset="50%" stop-color="#0B7BA7" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>

    <!-- Card 1 (Back Card) Gradient -->
    <linearGradient id="backCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card 2 (Front Card) Gradient -->
    <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Heart & Swipe Spark Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Orange School Accent -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F39200" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#002b4d" flood-opacity="0.4" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#091d2e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Inner Glow Ring -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Back Card (Tilted Left) -->
  <g transform="translate(256, 260) rotate(-14) translate(-256, -260)" opacity="0.75">
    <rect x="156" y="110" width="200" height="280" rx="28" fill="url(#backCardGrad)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
    <circle cx="256" cy="190" r="32" fill="#ffffff" fill-opacity="0.2" />
    <rect x="196" y="250" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.3" />
    <rect x="216" y="280" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.2" />
  </g>

  <!-- Front Card (Tilted Right - Active Swipe) -->
  <g transform="translate(256, 260) rotate(8) translate(-256, -260)" filter="url(#cardShadow)">
    <rect x="156" y="105" width="200" height="280" rx="28" fill="url(#frontCardGrad)" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Card Photo Area Placeholder -->
    <rect x="172" y="121" width="168" height="130" rx="18" fill="#0f172a" />
    
    <!-- Factory / Company Roof & Gears Silhouette inside Card Photo -->
    <path d="M 188 220 L 188 185 L 210 198 L 210 185 L 235 198 L 235 170 L 255 170 L 255 220 Z" fill="#38bdf8" fill-opacity="0.8" />
    <circle cx="295" cy="165" r="14" fill="#fbbf24" fill-opacity="0.9" />

    <!-- Card Text Lines -->
    <rect x="176" y="270" width="110" height="14" rx="7" fill="#0f172a" />
    <rect x="176" y="295" width="160" height="8" rx="4" fill="#94a3b8" />
    <rect x="176" y="312" width="130" height="8" rx="4" fill="#cbd5e1" />

    <!-- Floating Matching Heart Badge -->
    <circle cx="316" cy="340" r="28" fill="#ffffff" filter="url(#shadow)" />
    <path d="M 316 352 C 316 352 301 342 301 332 C 301 326.5 305.5 322 311 322 C 313.8 322 315.3 323.5 316 324.5 C 316.7 323.5 318.2 322 321 322 C 326.5 322 331 326.5 331 332 C 331 342 316 352 316 352 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Super-Like Traumberuf Star Spark (Top Right) -->
  <g transform="translate(375, 105)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="24" fill="url(#starGrad)" />
    <path d="M 0 -13 L 3.8 -4 L 13 -3 L 6 3.5 L 8 13 L 0 8 L -8 13 L -6 3.5 L -13 -3 L -3.8 -4 Z" fill="#ffffff" />
  </g>

  <!-- Dynamic Swipe Arrows (Switch Interaction) -->
  <path d="M 95 240 C 90 280, 110 340, 150 370" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 12" stroke-opacity="0.6" />
  <polyline points="135,372 154,372 154,353" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8" />

  <!-- Bottom Brand Pill -->
  <g transform="translate(256, 435)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#00375c" fill-opacity="0.6" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1.5">TIPSWITCH</text>
  </g>
</svg>
